[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-inference-optimization"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }, { name = "123bawanglong" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "CUDA fusion and decode-priority mixed scheduling experiments based on nano-vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/123bawanglong/nano-vllm-inference-optimization"
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["src/nano-vllm-cuda-mixed"]
include = ["nanovllm*"]

[tool.setuptools.package-data]
nanovllm = ["csrc/*.cpp", "csrc/*.cu"]
